<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athisa Health - Navbar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Roboto+Slab:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --color-cream: #FDF1EE;
    --color-primary: #885784;
    --color-white: #FFFFFF;
    --color-deep-purple: #602B7A;
    --color-muted: #878BAE54;
  }

  .navbar,
  .navbar * ,
  .mobile-menu,
  .mobile-menu * {
    margin: 0 !important;
    padding: 0 !important;
    box-sizing: border-box !important;
  }

  .navbar,
  .mobile-menu {
    font-family: 'Rubik', sans-serif !important;
  }

  .navbar {
    position: relative !important;
    z-index: 1100 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    background: transparent !important;
    padding: 16px 20px !important;
    width: 100% !important;
  }

  .navbar__logo {
    display: flex !important;
    align-items: center !important;
    flex-shrink: 0 !important;
  }

  .navbar__logo a {
    display: flex !important;
    align-items: center !important;
    text-decoration: none !important;
  }

  .navbar__logo img {
    height: 60px !important;
    width: auto !important;
    max-width: none !important;
    border: none !important;
  }

  .navbar__links {
    display: none !important;
    list-style: none !important;
    align-items: center !important;
    gap: 32px !important;
  }

  .navbar__links a {
    position: relative !important;
    text-decoration: none !important;
    color: var(--color-primary) !important;
    font-family: 'Rubik', sans-serif !important;
    font-size: 16px !important;
    font-weight: 400 !important;
    padding-bottom: 4px !important;
    transition: opacity 0.2s ease !important;
  }

  .navbar__links a::after {
    content: '' !important;
    position: absolute !important;
    left: 0 !important;
    bottom: 0 !important;
    width: 0 !important;
    height: 2px !important;
    background-color: var(--color-deep-purple) !important;
    border-radius: 2px !important;
    transition: width 0.25s ease !important;
  }

  .navbar__links a:hover,
  .navbar__links a:focus-visible {
    opacity: 0.85 !important;
  }

  .navbar__links a:hover::after,
  .navbar__links a:focus-visible::after {
    width: 100% !important;
  }

  .navbar__toggle {
    position: relative !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 5px !important;
    width: 44px !important;
    height: 44px !important;
    background: transparent !important;
    border: none !important;
    border-radius: 50% !important;
    cursor: pointer !important;
    padding: 0 !important;
    transition: background-color 0.25s ease !important;
  }

  .navbar__toggle.is-active {
    background-color: rgba(136, 87, 132, 0.12) !important;
  }

  .navbar__toggle span {
    display: block !important;
    width: 18px !important;
    height: 2px !important;
    background-color: var(--color-primary) !important;
    border-radius: 2px !important;
    transition: transform 0.3s ease, opacity 0.3s ease !important;
  }

  .navbar__toggle.is-active span:nth-child(1) {
    transform: translateY(8px) rotate(45deg) !important;
  }

  .navbar__toggle.is-active span:nth-child(2) {
    opacity: 0 !important;
  }

  .navbar__toggle.is-active span:nth-child(3) {
    transform: translateY(-8px) rotate(-45deg) !important;
  }

  /* Mobile full-width menu */
  .mobile-menu {
    position: fixed !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100vh !important;
    background-color: var(--color-cream) !important;
    overflow: hidden !important;
    transform: translateY(-100%) !important;
    transition: transform 0.4s cubic-bezier(0.65, 0, 0.35, 1) !important;
    z-index: 1050 !important;
    padding: 130px 32px 32px !important;
  }

  .mobile-menu.is-open {
    transform: translateY(0) !important;
  }

  /* Decorative blurred accents */
  .mobile-menu::before,
  .mobile-menu::after {
    content: '' !important;
    position: absolute !important;
    border-radius: 50% !important;
    filter: blur(60px) !important;
    pointer-events: none !important;
    z-index: 0 !important;
  }

  .mobile-menu::before {
    width: 260px !important;
    height: 260px !important;
    background: var(--color-muted) !important;
    top: -80px !important;
    right: -80px !important;
  }

  .mobile-menu::after {
    width: 220px !important;
    height: 220px !important;
    background: rgba(136, 87, 132, 0.25) !important;
    bottom: -60px !important;
    left: -60px !important;
  }

  .mobile-menu__brandmark {
    position: absolute !important;
    bottom: 40px !important;
    right: -20px !important;
    width: 220px !important;
    opacity: 0.08 !important;
    pointer-events: none !important;
    z-index: 0 !important;
  }

  .mobile-menu__links {
    position: relative !important;
    list-style: none !important;
    display: flex !important;
    flex-direction: column !important;
    gap: 28px !important;
    z-index: 1 !important;
  }

  .mobile-menu__links li {
    opacity: 0 !important;
    transform: translateY(14px) !important;
    transition: opacity 0.4s ease, transform 0.4s ease !important;
  }

  .mobile-menu.is-open .mobile-menu__links li {
    opacity: 1 !important;
    transform: translateY(0) !important;
  }

  .mobile-menu.is-open .mobile-menu__links li:nth-child(1) { transition-delay: 0.12s !important; }
  .mobile-menu.is-open .mobile-menu__links li:nth-child(2) { transition-delay: 0.18s !important; }
  .mobile-menu.is-open .mobile-menu__links li:nth-child(3) { transition-delay: 0.24s !important; }
  .mobile-menu.is-open .mobile-menu__links li:nth-child(4) { transition-delay: 0.3s !important; }
  .mobile-menu.is-open .mobile-menu__links li:nth-child(5) { transition-delay: 0.36s !important; }

  .mobile-menu__links a {
    position: relative !important;
    display: inline-block !important;
    text-decoration: none !important;
    color: var(--color-primary) !important;
    font-family: 'Rubik', sans-serif !important;
    font-size: 20px !important;
    font-weight: 500 !important;
    transition: color 0.2s ease, transform 0.2s ease !important;
  }

  .mobile-menu__links a::after {
    content: '' !important;
    position: absolute !important;
    left: 0 !important;
    bottom: -4px !important;
    width: 0 !important;
    height: 2px !important;
    background-color: var(--color-deep-purple) !important;
    border-radius: 2px !important;
    transition: width 0.25s ease !important;
  }

  .mobile-menu__links a:hover,
  .mobile-menu__links a:focus-visible {
    color: var(--color-deep-purple) !important;
    transform: translateX(4px) !important;
  }

  .mobile-menu__links a:hover::after,
  .mobile-menu__links a:focus-visible::after {
    width: 100% !important;
  }

  @media (min-width: 900px) {
    .navbar {
      padding: 22px 60px !important;
    }

    .navbar__links {
      display: flex !important;
    }

    .navbar__toggle {
      display: none !important;
    }
  }

  @media (max-width: 900px) {
    .navbar__logo img {
      height: 40px !important;
    }
  }
</style>
</head>
<body>

<header class="navbar">
  <nav class="navbar__links" aria-label="Primary navigation">
    <a href="#home">Home</a>
    <a href="#services">Services</a>
    <a href="#about">About Us</a>
    <a href="#faq">FAQ</a>
    <a href="#contact">Contact Us</a>
  </nav>

  <div class="navbar__logo">
    <a href="/" aria-label="Athisa Health home">
      <img src="https://violet-fish-669625.hostingersite.com/wp-content/uploads/2026/07/AthisaLogo.svg" alt="Athisa Health">
    </a>
  </div>

  <button class="navbar__toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobileMenu">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<nav class="mobile-menu" id="mobileMenu" aria-label="Mobile navigation">
  <img class="mobile-menu__brandmark" src="assets/AthisaLogo.svg" alt="" aria-hidden="true">
  <ul class="mobile-menu__links">
    <li><a href="#home">Home</a></li>
    <li><a href="#services">Services</a></li>
    <li><a href="#about">About Us</a></li>
    <li><a href="#faq">FAQ</a></li>
    <li><a href="#contact">Contact Us</a></li>
  </ul>
</nav>

<script>
  const toggle = document.getElementById('menuToggle');
  const menu = document.getElementById('mobileMenu');

  function closeMenu() {
    toggle.classList.remove('is-active');
    toggle.setAttribute('aria-expanded', 'false');
    menu.classList.remove('is-open');
  }

  function openMenu() {
    toggle.classList.add('is-active');
    toggle.setAttribute('aria-expanded', 'true');
    menu.classList.add('is-open');
  }

  toggle.addEventListener('click', () => {
    const isOpen = menu.classList.contains('is-open');
    isOpen ? closeMenu() : openMenu();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMenu();
  });
</script>

</body>
</html>
